<!doctype html>
<html lang="en" class="h-100">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <link rel="shortcut icon" href="/favicon.ico" />
        <title>Frater Brians Divination Blog.</title>
        <link
            rel="stylesheet"
            type="text/css"
            rel="preload"
            as="style"
            href="/site.css"
        />
    </head>
    <body>
        <div class="container">
            <header>
                <h1><a href="/" id="heading">Frater Brian</a></h1>
            </header>
            <nav>
                <div class="menu">
                    <ul>
			            <li><a href="/" class="menu-item">Home</a></li>    
                        <li><a href="/blog" class="menu-item">Blog</a></li>
                        <li><a href="https://fraterbrian.bandcamp.com/" class="menu-item" target="new">Bandcamp</a></li>
                        <li><a href="https://metalhead.club/@redfern" target="new" class="menu-item">Mastadon</a></li>
                    </ul>
                </div>
            </nav>
            <main>
                <div class="centered">
                    <picture>
                        <a href="/"
                            ><img
                                src="/redfern.svg"
                                id="logo"
                                alt="Brian Redfern"
                        /></a>
                    </picture>
                </div>
                <div>{% block content %} {% endblock %}</div>
            </main>
            <aside>
                <div class="aside-content">
                    <h3>Request a Reading</h3>
                    <form method="post" action="https://api.sheetmonkey.io/form/rR5Cq6f3kdwjszAjUbk6nq" autoComplete="on" class="sm__form"><div class="sm__form__fields"><div class="sm-form-title"><h2 class="sm-form-title__header">Reading Request</h2></div><input type="hidden" name="x-sheetmonkey-redirect" value="https://fraterbrian.com/"/><div class="sm-field__wrapper"><div class="sm-field__wrapper__inside"><div class="sm-field sm-field--name sm-field--large"><label class="sm-field__label" for="sm-field-jBoDXT8FHc-first-name">Name   </label><div class="sm-field__group"><div class="sm-field__group-item"><input type="text" class="sm-field__input sm-field__input--text sm-field__input--first-name" id="sm-field-jBoDXT8FHc-first-name" name="Name - First Name" placeholder="First" autoComplete="given-name"/></div><div class="sm-field__group-item"><input type="text" class="sm-field__input sm-field__input--text sm-field__input--last-name" id="sm-field-jBoDXT8FHc-last-name" name="Name - Last Name" placeholder="Last" autoComplete="family-name"/></div></div></div></div></div><div class="sm-field__wrapper"><div class="sm-field__wrapper__inside"><div class="sm-field sm-field--email sm-field--large"><label class="sm-field__label" for="sm-field-2egGsI8WJ0">Email   </label><input type="email" class="sm-field__input sm-field__input--text" id="sm-field-2egGsI8WJ0" name="Email" autoComplete="email"/></div></div></div><div class="sm-actions__container"><button type="submit" class="sm-btn sm-btn--primary">Submit</button></div><div class="sm-branding-footer"><a href="https://sheetmonkey.io/form-builder?ref=form" target="_blank">🐵  Made with Sheet Monkey</a></div></div></form>
                </div>
            </aside>
            <footer class="centered">&#169; 2026 Brian Redfern</footer>
        </div>
        <script src="/contact.js" defer></script>
    </body>
</html>
